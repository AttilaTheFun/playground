# The Playground's CI, as isomer's, by the owner's policy for protected
# repositories (AttilaTheFun/reviews' docs/CI_POLICY.md, and the shape of
# 2026-11-08: tests without a GUI before a merge, builds after one, the GUI
# tests by hand; and of 2026-11-15: the screenshot proof only ahead of a
# release, run: release or run: proof by hand). On GitHub's own free
# standard runners (a fork runs them as they are; AGENTS.md, "CI"), but for
# the Apple targets: the web, Linux and Android together, one job and one
# Bazel output base, in Swift's image (by digest) on x86_64 Ubuntu, with
# the Linux app's libraries added (tools/ci/job_tools.sh; Android's SDK
# tools are x86_64). The Apple targets (the owner, 2026-11-27: no paid
# GitHub runners) on Nimbus' self-hosted runners (`[self-hosted,
# playground-ci]`), as isomer's: single-use Linux containers that never
# take a pull request's job, get no secret and no token that writes, and
# reach only the hosts Nimbus lists for the Playground; built there with
# rules_applecross (.bazelrc's apple_on_linux: Xcode 27.2's SDKs from
# Nimbus' files, never on GitHub's runners, as Apple's SDKs may not be
# redistributed; .github/actions/nimbus_bazel); what needs macOS itself
# (the iPhone simulator, the Mac app on screen) in a macOS VM such a job
# leases from Nimbus (.github/actions/mac_vm), and there too a proposal's and
# a release's apps, built with Xcode (its own rendering of their icons). The compilers the apps carry come from this repository's
# `compilers` release (tools/ci/stage_playground_compilers.sh), for the
# jobs that publish or picture the apps. Bazel's caches are GitHub's
# (.github/actions/bazel_cache), written by main's builds alone, and
# BuildBuddy's remote cache, its key the BUILDBUDDY_API_KEY secret, handed
# to the cache action's setup alone, in every job, before a merge and after
# (tools/ci/ci_bazel.sh: each reads and writes; main's push builds and the
# release jobs download every output). A fork's pull request, which GitHub
# gives no secrets, builds on GitHub's cache alone.
#
# - pull requests: container (web, Linux, Android; the required check):
#   every app built, then the tests without a GUI (the sites' import
#   checks; container_build.sh pr). A newer push cancels its run. No macOS
#   job (the owner, 2026-11-13: Apple builds at release verification):
#   container-apple (the iPhone and the Mac) runs by hand, `run:
#   container-apple`, on a branch that touches Apple code.
# - main's commits: populate, populate-apple (the same, and what a release
#   builds, into the caches; never a proof).
# - by hand (`run:`): verify (the builds and the tests, no proof: verify,
#   verify-apple; the Playground has no GUI tests a runner runs yet:
#   tests/e2e and the iPhone's XCUITest probe drive a simulator and an
#   emulator by hand); proof (the screenshot proof alone: proof,
#   verify-apple, proof-shoot, apple (iphone), apple (mac), proof-compare:
#   built where each platform builds, pictured on GitHub's Ubuntu, an
#   agent-sim phone and a Nimbus macOS VM, written in Reviews' format 2,
#   each picture an item under a stable id that Reviews compares with the
#   previous release's, not CI; uploaded as the `proof` artifact and
#   attached to a release's draft as proof.zip; tools/ci/proof.sh;
#   `kind: quick` takes the same screens, marked as a quick proof's; on a
#   commit of main, or, to bisect a regression, on a branch pushed at an
#   earlier one); prerelease (main: the Alphas, built by apple (mac) and
#   signed by alpha with the `release` environment's keys and drafted,
#   build_tools' `sign`); release (main: verify's jobs and the proof,
#   then the Alphas and a draft proposed for release; the one run that
#   proves and verifies at once, which tools/ci/verified.sh asks for).
#   There is no adhoc run: a branch's builds are experiments only (the
#   owner, 2026-11-12). Drafts are CI's: no agent publishes one or makes a
#   tag.
# - a published release (its v* tag, made in Reviews): verified
#   (tools/ci/verified.sh), the proposal's Apple Alphas stamped Production
#   and signed again (nothing Apple rebuilt), Android's built for
#   production and signed, the assets attached (release-apple, release):
#   the signed builds (the iPhone's, the Mac's with its disk image,
#   Android's, and builds.json, which Applications reads) and the iPhone app
#   for the simulator, beside the proposal's proof.zip. pages.yml deploys its
#   web site. A pre-release is never released so.
# The signing keys reach only the alpha and release jobs' signing steps.
name: Build
on:
  push:
    # main's commits: populate, and populate-apple on Nimbus.
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run:
        description: "What to run: verify (the tests, no proof), prerelease or release on main (verify on a branch to bisect); proof (the screenshot proof alone); populate-apple (the Apple cache's build, as each push to main) on main; container-apple (a pull request's Apple build) on any"
        type: choice
        options: [verify, proof, prerelease, release, populate-apple, container-apple]
        default: verify
      kind:
        description: The proof's kind
        type: choice
        options: [full, quick]
        default: full
# A pull request's newer push (a rebase, an update with main) cancels its
# branch's older run, whose result no longer counts. Every other run
# (populate, a run by hand, a release) is a group of its own and never
# cancelled, so a publish is never cut off halfway.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.head_ref) || format('build-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# What the publishing jobs build (flags as --name=value): the iPhone and
# iPad app (a device build, signed ad hoc with a placeholder profile by
# --config=ci_device, which build_tools' `sign apple` signs again with the
# bundle id's own) and the Mac app with Xcode in a Nimbus macOS VM, both optimized and
# with the compiler linked in (--define=iso_playground_embedded=1, the
# device's staged first); Android's (its android_binary's .apk, its staged compiler
# inside) on Linux; the web site packaged by tools/playground/package_site.sh.
# The Android release key's name and its certificate's SHA-256, pinned
# (build_tools' `sign android`): the APK is left unsigned, with a warning,
# until the pin is filled in here.
env:
  PUBLISHED_APPLE: >-
    --config=ci_device --compilation_mode=opt --define=iso_playground_embedded=1
    //apple/playground_ios_application:playground_ios_application
    //apple/playground_macos_application:playground_macos_application
  PUBLISHED_LINUX: >-
    --compilation_mode=opt
    //android/playground_android_application:playground_android_application_apk
  ANDROID_KEY: playground
  ANDROID_PIN: "156375982DC2B1E6692E6FBEEE77204A9767B1EA2337ED42AF33DA2008F0C364"

jobs:
  # --- Pull requests: every platform built, the tests without a GUI -------

  # The web, Linux and Android in one job, one Bazel output base on the
  # runner's second disk: Swift's image on x86_64 (Android's SDK tools are
  # x86_64), the Linux app's libraries added by job_tools.sh.
  container:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      # Bazel's tree on the runner's second disk (ISOMER_BAZEL_ROOT).
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 180
    env:
      ISOMER_PLATFORMS: web linux android
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
      - name: Every app built, and the tests without a GUI
        env:
          ISOMER_EXECUTION_LOGS: ${{ runner.temp }}/execution-logs
        run: exec tools/ci/container_build.sh pr
      # What each invocation ran, to find what the cache misses.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: execution-logs
          path: ${{ runner.temp }}/execution-logs
          retention-days: 1

  container-apple:
    if: github.event_name == 'workflow_dispatch' && inputs.run == 'container-apple'
    runs-on: [self-hosted, playground-ci]
    timeout-minutes: 180
    env:
      ISOMER_PLATFORMS: apple
    steps:
      - uses: actions/checkout@v5
      - name: The Mac's compiler, staged (a Mac app built on Linux)
        run: tools/ci/stage_playground_compilers.sh macos
      - uses: ./.github/actions/nimbus_bazel
      - name: The iPhone and Mac apps built, on Linux
        run: exec tools/ci/container_build.sh pr

  # --- main: the merged tree built into the caches ------------------------

  populate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 180
    env:
      ISOMER_PLATFORMS: web linux android
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - id: cache
        uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: The merged tree, built into the cache
        env:
          ISOMER_EXECUTION_LOGS: ${{ runner.temp }}/execution-logs
        run: exec tools/ci/container_build.sh all
      # And what a release builds here: the Android app as alpha builds it
      # (never the proof's apps: no proof on a push).
      - name: The published Android app, built into the cache
        run: exec tools/ci/container_build.sh package .ci/packages --config=alpha $PUBLISHED_LINUX
      # The web, Linux and Android's share of GitHub's 10 GB.
      - uses: ./.github/actions/bazel_cache_save
        if: ${{ !cancelled() }}
        with:
          group: ubuntu
          gigabytes: 6
          repository-hit: ${{ steps.cache.outputs.repository-hit }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: execution-logs
          path: ${{ runner.temp }}/execution-logs
          retention-days: 1

  # The Apple cache's build, on a Nimbus runner at each push to main (and by
  # hand): Nimbus grants its cache's write to a push to main alone (the
  # job's OIDC token, a job its `ci.populate` names). One at a time, the
  # newest waiting: a newer push's replaces one that waits.
  populate-apple:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run == 'populate-apple')
    runs-on: [self-hosted, playground-ci]
    timeout-minutes: 180
    concurrency:
      group: populate-apple
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ISOMER_PLATFORMS: apple
    steps:
      - uses: actions/checkout@v5
      - name: The Mac's compiler, staged (a Mac app built on Linux)
        run: tools/ci/stage_playground_compilers.sh macos
      - uses: ./.github/actions/nimbus_bazel
        with:
          cache-write: ${{ github.event_name == 'push' && 'true' || 'false' }}
      - name: The merged tree's Apple apps, built into the cache
        run: exec tools/ci/container_build.sh all
      # The device's compiler, which the published iPhone app links.
      - name: The Playground's compilers
        run: tools/ci/stage_playground_compilers.sh ios-device
      - name: The published Apple apps, built into the cache
        run: exec tools/ci/container_build.sh package .ci/packages --config=alpha $PUBLISHED_APPLE

  # Apple isn't checked on a pull request, so a broken main is seen in
  # populate-apple first: an issue says so (one, commented on each time it
  # stays broken), from GitHub's runner, so no token that writes reaches
  # Nimbus'.
  apple-failed:
    needs: populate-apple
    if: ${{ failure() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: A broken main, said in an issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Apple build failed on main"
          body="populate-apple failed on $GITHUB_SHA: $RUN"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi

  # --- By hand: verify (the builds and the tests, no proof) ---------------

  verify:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release')
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    timeout-minutes: 180
    env:
      ISOMER_PLATFORMS: web linux android
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Build, and the tests without a GUI
        run: exec tools/ci/container_build.sh

  # Every Apple app a run tests or pictures, built on one Nimbus runner in
  # one Bazel output base: verify's and the proof's (its stage build,
  # proof-apple's until the two were folded together). The proof's are
  # pictured in the apple jobs: the iPhone's on agent-sim's phones, the
  # Mac's in a macOS VM.
  verify-apple:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'verify' || inputs.run == 'release' || inputs.run == 'proof')
    runs-on: [self-hosted, playground-ci]
    timeout-minutes: 180
    env:
      ISOMER_PLATFORMS: apple
      PROOF_KIND: ${{ inputs.kind || 'full' }}
    steps:
      - uses: actions/checkout@v5
      - name: The Mac's compiler, staged (a Mac app built on Linux)
        run: tools/ci/stage_playground_compilers.sh macos
      - uses: ./.github/actions/nimbus_bazel
      - name: Build, on Linux
        if: inputs.run != 'proof'
        run: tools/ci/container_build.sh
      - name: The proof's iPhone and Mac apps, on Linux
        if: inputs.run != 'verify'
        run: >-
          tools/ci/proof.sh --stage build --platform ios,macos --kind "$PROOF_KIND"
          --apps "$RUNNER_TEMP/proof-apps" --review "$RUNNER_TEMP/proof-review"
      - uses: actions/upload-artifact@v4
        if: inputs.run != 'verify'
        with:
          name: proof-apps-ios
          path: ${{ runner.temp }}/proof-apps/ios
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: inputs.run != 'verify'
        with:
          name: proof-apps-macos
          path: ${{ runner.temp }}/proof-apps/macos
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && inputs.run != 'verify' }}
        with:
          name: proof-part-build-apple
          path: ${{ runner.temp }}/proof-review
          retention-days: 1

  # --- By hand: the proof, built where each platform builds -------------

  # The web's and Android's (for x86_64, the Ubuntu runner's emulator's
  # ABI, the compiler it carries x86_64's) in one Linux job.
  proof:
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'release' || inputs.run == 'proof')
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    concurrency:
      group: playground-proof-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 180
    env:
      PROOF_KIND: ${{ inputs.kind || 'full' }}
      ISOMER_PLATFORMS: web android
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: The web and Android apps built
        run: >-
          exec tools/ci/proof.sh --stage build --platform web,android --kind "$PROOF_KIND"
          --apps "$RUNNER_TEMP/proof-apps" --review "$RUNNER_TEMP/proof-review"
      - uses: actions/upload-artifact@v4
        with:
          name: proof-apps-web
          path: ${{ runner.temp }}/proof-apps/web
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: proof-apps-android
          path: ${{ runner.temp }}/proof-apps/hosted/android
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof-part-build-linux
          path: ${{ runner.temp }}/proof-review
          retention-days: 1

  # The proof pictured on GitHub's own Ubuntu runners (tools/ci/proof.sh
  # --stage shoot, tools/proof/proof.py --here): Android on an emulator
  # under the runner's KVM, the web in its Chrome. The iPhone's and the
  # Mac's are the apple jobs'. Each its own part, whatever came back: a
  # broken screen is what the proof is for.
  proof-shoot:
    needs: proof
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.run == 'release' || inputs.run == 'proof') }}
    strategy:
      fail-fast: false
      matrix:
        platform: [android, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PROOF_KIND: ${{ inputs.kind || 'full' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: proof-apps-${{ matrix.platform }}
          path: ${{ runner.temp }}/apps/${{ matrix.platform == 'android' && 'hosted/android' || matrix.platform }}
      - name: The app pictured here
        run: >-
          exec tools/ci/proof.sh --stage shoot --platform ${{ matrix.platform }} --kind "$PROOF_KIND"
          --apps "$RUNNER_TEMP/apps" --review "$RUNNER_TEMP/review"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof-part-${{ matrix.platform }}
          path: ${{ runner.temp }}/review
          retention-days: 1

  # The iPhone's proof pictures on an agent-sim phone (its `xcrun simctl`,
  # on a Nimbus runner with Apple's runtime, `[self-hosted,
  # playground-ios]`): no VM.
  apple-iphone:
    name: apple (iphone)
    needs: verify-apple
    if: ${{ !cancelled() && needs.verify-apple.result == 'success' && (inputs.run == 'release' || inputs.run == 'proof') }}
    runs-on: [self-hosted, playground-ios]
    timeout-minutes: 120
    env:
      PROOF_KIND: ${{ inputs.kind || 'full' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: proof-apps-ios
          path: ${{ runner.temp }}/apps/ios
      - name: A phone
        run: agent-sim phones up 1
      - name: The proof's iPhone pictures
        run: >-
          tools/ci/proof.sh --stage shoot --platform ios --kind "$PROOF_KIND"
          --apps "$RUNNER_TEMP/apps" --review "$RUNNER_TEMP/review"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof-part-ios
          path: ${{ runner.temp }}/review
          retention-days: 1

  # Everything that needs macOS, in one Nimbus macOS VM (Xcode 27.2) this
  # job leases (.github/actions/mac_vm), one VM a run at most (Nimbus lends
  # two to everyone): at a proof, the proof's Mac pictures; at a prerelease
  # or release, then, the Alphas, built with Xcode for its own rendering of
  # their icons and the Mac app's compiler assembled from the VM's Xcode
  # (unsigned, without the builder's values: alpha stamps and signs them on
  # GitHub's runner).
  apple-mac:
    name: apple (mac)
    needs: [verify-apple, alpha-version]
    if: >-
      ${{ !cancelled() && github.event_name == 'workflow_dispatch' &&
      (needs.verify-apple.result == 'success' || (inputs.run == 'prerelease' && needs.verify-apple.result == 'skipped')) &&
      (needs.alpha-version.result == 'success' || needs.alpha-version.result == 'skipped') &&
      (inputs.run == 'proof' || inputs.run == 'prerelease' || inputs.run == 'release') }}
    runs-on: [self-hosted, playground-ci]
    timeout-minutes: 180
    env:
      PROOF: ${{ (inputs.run == 'proof' || inputs.run == 'release') && 'true' || 'false' }}
      ALPHA: ${{ (inputs.run == 'prerelease' || inputs.run == 'release') && 'true' || 'false' }}
      PROOF_KIND: ${{ inputs.kind || 'full' }}
    steps:
      - uses: actions/checkout@v5
      - name: Version
        if: env.ALPHA == 'true'
        env:
          VERSION: ${{ needs.alpha-version.outputs.version }}
        run: tools/ci/stamp_apps.sh "$VERSION"
      # The device's compiler, linked into the iPhone's Alpha.
      - name: The Playground's compilers
        if: env.ALPHA == 'true'
        run: tools/ci/stage_playground_compilers.sh ios-device
      - uses: actions/download-artifact@v4
        if: env.PROOF == 'true'
        with:
          name: proof-apps-macos
          path: .ci/proof-apps/macos
      - name: The Mac's proof pictures and the Alphas, in a macOS VM
        uses: ./.github/actions/mac_vm
        with:
          env: |
            PROOF=${{ env.PROOF }}
            ALPHA=${{ env.ALPHA }}
            PROOF_KIND=${{ env.PROOF_KIND }}
            PUBLISHED_APPLE=${{ env.PUBLISHED_APPLE }}
          out: .ci/proof-review .ci/packages
          run: |
            status=0
            if [ "$PROOF" = true ]; then
              tools/ci/proof.sh --stage shoot --platform macos --kind "$PROOF_KIND" \
                --apps "$PWD/.ci/proof-apps" --review "$PWD/.ci/proof-review" || status=1
            fi
            if [ "$ALPHA" = true ]; then
              ISOMER_PLATFORMS=apple tools/ci/container_build.sh package .ci/packages --config=alpha $=PUBLISHED_APPLE || status=1
            fi
            exit $status
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.PROOF == 'true' }}
        with:
          name: proof-part-macos
          path: .ci/proof-review
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: env.ALPHA == 'true'
        with:
          name: alpha-apple
          path: |
            .ci/packages/*.ipa
            .ci/packages/*.zip
          retention-days: 1
          if-no-files-found: error

  # The parts written into the `proof` artifact Reviews reads (format 2:
  # proof.json and its files; tools/ci/proof_write.swift), whichever came
  # back (a missing platform's pictures fail it). Nothing is compared: the
  # job keeps its name, which tools/ci/verified.sh and alpha ask for.
  proof-compare:
    needs: [proof, verify-apple, proof-shoot, apple-iphone, apple-mac]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (inputs.run == 'release' || inputs.run == 'proof') }}
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
    timeout-minutes: 30
    env:
      PROOF_KIND: ${{ inputs.kind || 'full' }}
      # The job's tools without the Linux app's libraries.
      ISOMER_PLATFORMS: web
    steps:
      - uses: actions/checkout@v5
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: proof-part-*
          path: ${{ runner.temp }}/parts
      - name: The proof
        run: exec tools/ci/proof.sh --stage compare --kind "$PROOF_KIND" --parts "$RUNNER_TEMP/parts" --proof "$RUNNER_TEMP/proof"
      # The run's `proof`, which Reviews reads (and a release's draft carries
      # as proof.zip besides): kept as isomer keeps its own; every other
      # artifact for a day.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof
          path: ${{ runner.temp }}/proof
          retention-days: 90

  # --- By hand on main: a proposal (prerelease, or release once verified) -

  # The proposal's version, MAJOR.MINOR.N, from the repository's releases
  # (tools/ci/version_from_tags.sh: the same again for the same commit;
  # drafts too, which only a token that writes lists), on GitHub's runner
  # at the run's start (no token that writes reaches Nimbus'): apple (mac)
  # builds the Alphas at it, alpha signs and drafts them.
  alpha-version:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      (inputs.run == 'prerelease' || inputs.run == 'release')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/stamp_apps.sh

  alpha:
    # The proposal: Android's Alpha and the site built, every build signed
    # (build_tools' `sign`: a platform whose keys aren't set is
    # skipped, saying so), the draft made with the site and the builds
    # attached (tools/ci/draft_release.sh, attach_release.sh:
    # Playground-<version>-ios.ipa, -macos.zip, -android.apk and builds.json,
    # which Applications lists), and a release's proof with them (proof.zip).
    # A prerelease: the version and apple (mac)'s Alphas. A release: those
    # once verify and the proof passed.
    needs: [alpha-version, apple-mac, verify, verify-apple, proof-compare]
    if: >-
      ${{ !cancelled() && needs.alpha-version.result == 'success' && needs.apple-mac.result == 'success' &&
      (inputs.run == 'prerelease' || (needs.verify.result == 'success' && needs.verify-apple.result == 'success' &&
      needs.proof-compare.result == 'success')) }}
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    environment: release
    timeout-minutes: 180
    permissions:
      # The draft release.
      contents: write
      # This run's proof artifact.
      actions: read
    env:
      ISOMER_PLATFORMS: android web
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      - uses: actions/checkout@v5
        with:
          # The draft's changes since the previous release.
          fetch-depth: 0
      - name: The job's tools
        run: tools/ci/job_tools.sh
      - name: Version
        env:
          VERSION: ${{ needs.alpha-version.outputs.version }}
        run: tools/ci/stamp_apps.sh "$VERSION"
      # The owner's line rule: no proposal on a line that already has a
      # published release (tools/ci/check_version_line.sh), before anything
      # is built.
      - name: The version's line is open
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.alpha-version.outputs.version }}
        run: tools/ci/check_version_line.sh "$VERSION"
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      # Android's compiler (the APK's) and the browser's (the site's).
      - name: The Playground's compilers
        run: tools/ci/stage_playground_compilers.sh android web
      # exec: the runner's cancel reaches the build.
      - name: Build
        run: exec tools/ci/container_build.sh package .ci/packages --config=alpha $PUBLISHED_LINUX
      # The web site the release carries, which pages.yml deploys when it's
      # published: stamped with the version above, its in-browser compiler
      # the one staged.
      - name: The site
        run: >-
          tools/playground/package_site.sh
          --toolchain-from web/playground_web_application/staged_toolchain
          --out "$GITHUB_WORKSPACE/.ci/playground-site.tar.gz"
      - uses: actions/download-artifact@v4
        with:
          name: alpha-apple
          path: .ci/packages
      # Nothing is published if the Mac app's icon has no dark appearance.
      - name: The icon's dark appearance
        run: tools/ci/check_mac_icons.sh .ci/packages
      # build_tools' `sign` and what it runs (//tools/ci_tools), built in a
      # step with no key in its environment (build_tools' README: Bazel's
      # server and build events see its client's environment), their paths
      # handed to the signing steps, which run `sign` directly.
      - name: The signing tools
        shell: bash
        run: |
          bazel build //tools/ci_tools:all
          base="$(bazel info output_base)" root="$(bazel info execution_root)"
          for tool in sign rcodesign dmg java apksigner aapt2; do
            path="$(bazel cquery --output=files "//tools/ci_tools:$tool" | head -1)"
            [ -n "$path" ] || { echo "::error::no $tool"; exit 1; }
            case "$path" in external/*) path="$base/$path" ;; *) path="$root/$path" ;; esac
            echo "BUILD_TOOLS_${tool^^}=$path" >> "$GITHUB_ENV"
          done
      # The keys reach these steps alone, each its own platform's. The Apple
      # apps, named <App>-<version>-<platform>.<ext>, each line of
      # builds.json written (the Mac's icon beside it); an ad hoc profile
      # where a distribution identity is set, else development's.
      # A platform whose keys aren't set is skipped, saying so in the
      # summary.
      # The builder's values (secrets, so never on Nimbus' runner, which
      # built the apps without them) stamped in as the apps are signed, as a
      # Mac's own build stamps them (isomer's examples/tools/signing/defs.bzl):
      # the Info.plist's UpdateKitAppGroup, UpdateKitApplicationsBundleIDs
      # and ISOMER_INFOPLIST's keys; the app groups (UpdateKit's, the shared
      # sign-in's lock group); the shared sign-in's keychain group.
      - name: Sign the Apple apps
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
          APPLE_DEVELOPMENT_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_PASSWORD }}
          APPLE_PROFILES: ${{ secrets.APPLE_PROFILES }}
          ISOMER_UPDATE_APP_GROUP: ${{ secrets.ISOMER_UPDATE_APP_GROUP }}
          ISOMER_UPDATE_APPLICATIONS_BUNDLE_IDS: ${{ secrets.ISOMER_UPDATE_APPLICATIONS_BUNDLE_IDS }}
          ISOMER_INFOPLIST: ${{ secrets.ISOMER_INFOPLIST }}
        run: |
          test -n "$ISOMER_UPDATE_APP_GROUP" || { echo "::error::ISOMER_UPDATE_APP_GROUP is not set: the Alphas' UpdateKit would do nothing"; exit 1; }
          test -n "$ISOMER_INFOPLIST" || { echo "::error::ISOMER_INFOPLIST is not set: the Alphas would not share the sign-in"; exit 1; }
          umask 077; infoplist="$RUNNER_TEMP/infoplist.json"
          jq -n --arg group "$ISOMER_UPDATE_APP_GROUP" --arg ids "$ISOMER_UPDATE_APPLICATIONS_BUNDLE_IDS" --argjson keys "$ISOMER_INFOPLIST" \
            '($ids | split(",") | map(gsub("^ +| +$"; "")) | map(select(. != ""))) as $ids
             | {UpdateKitAppGroup: $group} + (if ($ids | length) > 0 then {UpdateKitApplicationsBundleIDs: $ids} else {} end) + $keys' > "$infoplist"
          groups="$RUNNER_TEMP/groups.json"
          jq -n --arg group "$ISOMER_UPDATE_APP_GROUP" --argjson keys "$ISOMER_INFOPLIST" \
            '{app: ([$group, ($keys.GitHubSharedLockGroup // "")] | map(select(. != "")) | unique),
              keychain: ([($keys.GitHubSharedKeychainGroup // "")] | map(select(. != "")))}' > "$groups"
          "$BUILD_TOOLS_SIGN" apple --key-from-env --rcodesign "$BUILD_TOOLS_RCODESIGN" \
            --add-infoplist "$infoplist" --add-groups "$groups" \
            --app Playground --ipa-kind ad-hoc,development --skip-missing-keys \
            --builds "$RUNNER_TEMP/assets/builds.json" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/assets" \
            .ci/packages/*.ipa .ci/packages/*.zip
          rm -f "$infoplist" "$groups"
      # Android's: its release key, its certificate pinned (ANDROID_PIN),
      # named <App>-<versionName>-android.apk; skipped, saying so in the
      # summary, when the key isn't set.
      - name: Sign the Android app
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: >-
          "$BUILD_TOOLS_SIGN" android --key-from-env --app "$ANDROID_KEY" --pin "$ANDROID_PIN"
          --java "$BUILD_TOOLS_JAVA" --apksigner "$BUILD_TOOLS_APKSIGNER" --aapt2 "$BUILD_TOOLS_AAPT2"
          --name Playground --variant Alpha --skip-missing-keys
          --out "$RUNNER_TEMP/assets" --builds "$RUNNER_TEMP/assets/builds.json" --commit "$GITHUB_SHA"
          .ci/packages/*.apk
      # A release's proof (this run's `proof`, Reviews' format 2), zipped
      # among the draft's assets as proof.zip: the release keeps it, and
      # Reviews compares the next release's with it.
      - uses: actions/download-artifact@v4
        if: inputs.run == 'release'
        with:
          name: proof
          path: ${{ runner.temp }}/proof
      - name: The proof, among the assets
        if: inputs.run == 'release'
        run: tools/ci/proof_zip.sh "$RUNNER_TEMP/proof" "$RUNNER_TEMP/assets/proof.zip"
      - name: The draft release, its builds attached
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.run }}
          VERSION: ${{ needs.alpha-version.outputs.version }}
        run: |
          tools/ci/draft_release.sh "$VERSION" "$KIND" .ci/playground-site.tar.gz
          tools/ci/attach_release.sh "v$VERSION" "$RUNNER_TEMP/assets"

  # --- A published release: nothing Apple rebuilt -----------------------

  release-apple:
    # The iPhone app for the simulator, a release's asset beside its signed
    # builds, with the compiler linked in (as the proof's): without it the
    # app builds but cannot compile a project.
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: [self-hosted, playground-ci]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      # The release's own version: its tag's (vX.Y.N), no token needed.
      - name: Version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: tools/ci/stamp_apps.sh "${TAG#v}"
      - name: The Playground's compilers
        run: tools/ci/stage_playground_compilers.sh ios-simulator
      # With Xcode 27.2 in a Nimbus macOS VM, as the Alphas are (Xcode's own
      # icons).
      - name: The iPhone's, for the simulator, with Xcode in a macOS VM
        uses: ./.github/actions/mac_vm
        with:
          env: |
            ISOMER_PLATFORMS=apple
          out: .ci/simulator
          run: >-
            tools/ci/container_build.sh package .ci/simulator --compilation_mode=opt --ios_multi_cpus=sim_arm64
            --define=iso_playground_embedded=1
            //apple/playground_ios_application:playground_ios_sim_application
      - uses: actions/upload-artifact@v4
        with:
          name: release-simulator
          path: .ci/simulator
          retention-days: 1
          if-no-files-found: error

  release:
    # When the owner publishes a GitHub release (its v0.48.N tag on a main
    # commit, whose proof is in): the iPhone's and the Mac's Alphas its
    # proposal attached (the builds the owner tested) stamped Production and
    # signed again (tools/ci/release_alphas.sh, `sign apple --variant
    # Production`; the Mac's with its disk image), Android's built for
    # production and signed, and the signed builds attached in place of the
    # Alphas (tools/ci/attach_release.sh), then the iPhone app for the
    # simulator (tools/ci/release_extras.sh).
    needs: release-apple
    if: ${{ !cancelled() && needs.release-apple.result == 'success' }}
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
      volumes: ["/mnt:/mnt"]
    environment: release
    timeout-minutes: 120
    permissions:
      # The release's assets.
      contents: write
      # Its commit's verify run.
      actions: read
    env:
      ISOMER_PLATFORMS: android
      ISOMER_BAZEL_ROOT: /mnt/bazel
    steps:
      # The tag's commit, with main's history beside it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The job's tools
        run: tools/ci/job_tools.sh
      # A release is a main commit: a tag whose commit isn't on main stops here.
      - name: The release is a main commit
        run: git merge-base --is-ancestor HEAD origin/main || { echo "::error::$GITHUB_REF_NAME's commit is not on main"; exit 1; }
      # No release of a commit not verified (its verify and proof passed, in a
      # run by hand): checked before anything is signed.
      - name: The commit was verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/verified.sh "$GITHUB_SHA"
      - name: The proposal's Alphas
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/release_alphas.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/alphas"
      # Android's build: the version of this commit's release
      # (tools/ci/version_from_tags.sh finds it by its commit).
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/stamp_apps.sh
      - uses: ./.github/actions/bazel_cache
        with:
          group: ubuntu
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: The Playground's compilers
        run: tools/ci/stage_playground_compilers.sh android
      - name: Android's, for production
        run: >-
          tools/ci/container_build.sh package .ci/android --config=prod --compilation_mode=opt
          //android/playground_android_application:playground_android_application_apk
      # build_tools' `sign` and what it runs (//tools/ci_tools), built in a
      # step with no key in its environment (build_tools' README: Bazel's
      # server and build events see its client's environment), their paths
      # handed to the signing steps, which run `sign` directly.
      - name: The signing tools
        shell: bash
        run: |
          bazel build //tools/ci_tools:all
          base="$(bazel info output_base)" root="$(bazel info execution_root)"
          for tool in sign rcodesign dmg java apksigner aapt2; do
            path="$(bazel cquery --output=files "//tools/ci_tools:$tool" | head -1)"
            [ -n "$path" ] || { echo "::error::no $tool"; exit 1; }
            case "$path" in external/*) path="$base/$path" ;; *) path="$root/$path" ;; esac
            echo "BUILD_TOOLS_${tool^^}=$path" >> "$GITHUB_ENV"
          done
      # The keys reach these steps alone, each its own platform's. The Apple
      # apps, named <App>-<version>-<platform>.<ext>, each line of
      # builds.json written (the Mac's icon beside it); an ad hoc profile
      # where a distribution identity is set, else development's.
      # Production: each app's BuildVariant made Production as it is signed
      # again (the proposal's tested Alphas promoted), the Mac's disk image
      # beside it.
      # A key not set fails the release, never publishing it without
      # that platform's app.
      - name: Sign the Apple apps
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
          APPLE_DEVELOPMENT_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_PASSWORD }}
          APPLE_PROFILES: ${{ secrets.APPLE_PROFILES }}
        run: >-
          "$BUILD_TOOLS_SIGN" apple --key-from-env --rcodesign "$BUILD_TOOLS_RCODESIGN"
          --app Playground --ipa-kind ad-hoc,development
          --variant Production --dmg "$BUILD_TOOLS_DMG"
          --builds "$RUNNER_TEMP/assets/builds.json" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/assets"
          "$RUNNER_TEMP"/alphas/*
      # Android's: its release key, its certificate pinned (ANDROID_PIN),
      # named <App>-<versionName>-android.apk; a key not set fails the release.
      - name: Sign the Android app
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: >-
          "$BUILD_TOOLS_SIGN" android --key-from-env --app "$ANDROID_KEY" --pin "$ANDROID_PIN"
          --java "$BUILD_TOOLS_JAVA" --apksigner "$BUILD_TOOLS_APKSIGNER" --aapt2 "$BUILD_TOOLS_AAPT2"
          --name Playground --variant Production
          --out "$RUNNER_TEMP/assets" --builds "$RUNNER_TEMP/assets/builds.json" --commit "$GITHUB_SHA"
          .ci/android/*.apk
      - name: The signed builds, attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/attach_release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/assets"
      - uses: actions/download-artifact@v4
        with:
          name: release-simulator
          path: .ci/simulator
      - name: The release's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/release_extras.sh upload "$GITHUB_REF_NAME" .ci/simulator
