<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; background: light-dark(#fff, rgb(18, 18, 20)); }
    /* The app owns the viewport: no document scroll, so a swipe never
       rubber-bands the page (inner ScrollViews still scroll). */
    body { position: fixed; inset: 0; width: 100%; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #root { position: absolute; inset: 0; overflow: hidden; display: flex; flex-direction: column; overscroll-behavior: none; }
    input, textarea { -webkit-user-select: text; user-select: text; }
    #error { font: 14px monospace; color: #b00; padding: 16px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- React 18 UMD globals for the react renderer. -->
  <script src="./runtime/react.production.min.js"></script>
  <script src="./runtime/react-dom.production.min.js"></script>
  <script type="module">
    import { runHotBundle } from "./hot_host.js";
    import { Dependencies } from "./app_bridge.js";
    import { pageDependencies } from "./page_dependencies.js";

    const dependencies = pageDependencies(Dependencies);

    fetch("./app.wasm")
      .then((response) => {
        if (!response.ok) throw new Error(`app.wasm fetch ${response.status}`);
        return response.arrayBuffer();
      })
      .then((wasm) => runHotBundle({ wasm, container: document.getElementById("root"), dependencies, bundleIdentifier: "dev.isomer.playground.web-run" }))
      .catch((error) => {
        const el = document.createElement("div");
        el.id = "error";
        el.textContent = String(error && error.stack ? error.stack : error);
        document.body.appendChild(el);
      });
  </script>
</body>
</html>
